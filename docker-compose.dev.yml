version: '3.8'

services:
  cpp-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: cpp-dev-container
    volumes:
      - .:/home/developer/workspace
      - cpp-build-cache:/home/developer/workspace/build
    working_dir: /home/developer/workspace
    stdin_open: true
    tty: true
    environment:
      - TERM=xterm-256color
    networks:
      - dev-network

volumes:
  cpp-build-cache:

networks:
  dev-network:
    driver: bridge
